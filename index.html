<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melde - Das Kartenspiel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('tisch.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .modal {
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .modal h2 {
            margin-top: 0;
            color: #ffcc00;
            letter-spacing: 1px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 10px;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #c9302c;
        }

        .room-list {
            max-height: 150px;
            overflow-y: auto;
            margin: 10px 0;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 5px;
            border-radius: 6px;
        }

        .room-item {
            padding: 8px;
            margin: 4px 0;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .room-item:hover {
            background: rgba(255,255,255,0.35);
        }

        #game-area {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- SCHRITT 1: Benutzerdaten eingeben -->
    <div id="user-modal" class="modal">
        <h2>MELDE</h2>
        <p>Bitte gib deine Daten ein</p>
        <input type="text" id="vorname" placeholder="Vorname" required>
        <input type="text" id="nachname" placeholder="Nachname" required>
        <input type="text" id="stadt" placeholder="Stadt" required>
        <button onclick="saveUserData()">Weiter</button>
    </div>

    <!-- SCHRITT 2: Räume erstellen oder beitreten -->
    <div id="room-modal" class="modal" style="display: none;">
        <h2>RÄUME</h2>
        <p id="welcome-user"></p>
        <input type="text" id="room-name" placeholder="Neuer Raum (max. 15 Zeichen)" maxlength="15">
        <button onclick="createRoom()">Raum erstellen</button>
        
        <p style="margin: 15px 0 5px 0; font-size: 14px;">Vorhandene Räume:</p>
        <div id="rooms-container" class="room-list">
            <div style="color: #aaa; text-align: center; font-size: 14px;">Keine Räume da</div>
        </div>
    </div>

    <!-- SPIELBEREICH (Später) -->
    <div id="game-area">
        <h1 id="room-title"></h1>
        <div id="status-message">Warte auf Mitspieler...</div>
        <div id="hand-container" style="display: flex; gap: 10px; margin-top: 20px;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myProfile = {};

        function saveUserData() {
            const vorname = document.getElementById('vorname').value.trim();
            const nachname = document.getElementById('nachname').value.trim();
            const stadt = document.getElementById('stadt').value.trim();

            if (!vorname || !nachname || !stadt) {
                alert('Bitte fülle alle Felder aus!');
                return;
            }

            myProfile = {
                name: `${vorname} ${nachname}`,
                stadt: stadt
            };

            document.getElementById('user-modal').style.display = 'none';
            document.getElementById('room-modal').style.display = 'block';
            document.getElementById('welcome-user').innerText = `Hallo, ${vorname} aus ${stadt}!`;

            // Nach Räumen fragen
            socket.emit('getRooms');
        }

        function createRoom() {
            const roomName = document.getElementById('room-name').value.trim();
            if (!roomName) {
                alert('Bitte gib einen Namen für den Raum ein!');
                return;
            }
            if (roomName.length > 15) {
                alert('Der Raumname darf maximal 15 Zeichen lang sein!');
                return;
            }

            socket.emit('joinRoom', { roomName, player: myProfile });
        }

        function joinSpecificRoom(roomName) {
            socket.emit('joinRoom', { roomName, player: myProfile });
        }

        socket.emit = (function(orig) {
            return function(event, data) {
                return orig.apply(this, arguments);
            };
        })(socket.emit);

        socket.on('roomListUpdate', (rooms) => {
            const container = document.getElementById('rooms-container');
            container.innerHTML = '';
            
            if (Object.keys(rooms).length === 0) {
                container.innerHTML = '<div style="color: #aaa; text-align: center; font-size: 14px;">Keine Räume da</div>';
                return;
            }

            for (let rName in rooms) {
                const room = rooms[rName];
                const div = document.createElement('div');
                div.className = 'room-item';
                div.innerHTML = `<span>${rName}</span> <span>(${room.playerCount}/4 Spieler)</span>`;
                div.onclick = () => joinSpecificRoom(rName);
                container.appendChild(div);
            }
        });

        socket.on('joinedRoomSuccess', (roomName) => {
            document.getElementById('room-modal').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('room-title').innerText = `Raum: ${roomName}`;
        });
    </script>
</body>
</html>
